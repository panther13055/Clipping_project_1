name: Add custom per-clip SFX

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_custom_sfx.py'
      - '.github/workflows/add-custom-sfx.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply custom SFX upgrade
        run: python .github/scripts/add_custom_sfx.py
      - name: Syntax check
        run: node --check app.js
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js style.css
          git commit -m "Add optional per-clip timed sound effects" || exit 0
          git push
