name: Apply Local AI and single-video mode v2

on:
  push:
    paths:
      - '.github/workflows/apply-local-ai-single-video-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch files
        shell: python
        run: |
          from pathlib import Path

          def rep(text, old, new, label):
              if old not in text:
                  raise SystemExit('Missing expected text: ' + label)
              return text.replace(old, new, 1)

          h = Path('index.html').read_text(encoding='utf-8')
          h = rep(h,
              '<span class="brand-sub">Vertical editor · up to 120s · 1080p / 720p / 480p export</span>',
              '<span class="brand-sub">Vertical editor · up to 120s · 1080p / 2K / 4K / 8K export</span>',
              'brand')
          h = rep(h,
              '<select id="inp-numranks">\n            <option>1</option>',
              '<select id="inp-numranks">\n            <option value="0">None · single video</option>\n            <option>1</option>',
              'None ranks option')
          h = rep(h,
              '<select id="export-quality">\n            <option value="4K">',
              '<select id="export-quality">\n            <option value="8K">8K — 4320×7680 — Extreme · powerful GPU recommended</option>\n            <option value="4K">',
              '8K select')
          h = rep(h,
              '2K/4K render text and graphics at higher resolution. Final detail still depends on the source clip quality and your browser/GPU.',
              '2K/4K/8K render text and graphics at higher resolution. 8K is extremely GPU/RAM intensive. AI upscale can improve perceived detail, but output resolution does not turn a poor source into native-camera 8K.',
              'quality note')
          h = rep(h,
              '<script src="app.js"></script>\n</body>',
              '<script src="app.js"></script>\n<script src="local_ai_bridge.js"></script>\n</body>',
              'bridge script')
          Path('index.html').write_text(h, encoding='utf-8')

          s = Path('app.js').read_text(encoding='utf-8')
          s = rep(s,
              '  const EXPORT_PROFILES = {\n    "4K":',
              '  const EXPORT_PROFILES = {\n    "8K":    { width: 4320, height: 7680, videoBitrate: 85_000_000, codec: "avc1.64003e" },\n    "4K":',
              '8K profile')
          s = rep(s,
              '    numRanks: 6,\n    titleColor:',
              '    numRanks: 6,\n    noRankMode: false,\n    titleColor:',
              'noRank state')

          old = "  function setNumRanks(n) {\n    n = Math.max(1, Math.min(10, n));\n    while (state.ranks.length < n) state.ranks.push(makeRank(state.ranks.length + 1));\n    state.ranks.length = n;\n    state.numRanks = n;\n    if (state.editRank > n) state.editRank = 1;\n    resetOrder();\n  }"
          new = "  function setNumRanks(n) {\n    const noRank = Number(n) === 0;\n    n = noRank ? 1 : Math.max(1, Math.min(10, n));\n    state.noRankMode = noRank;\n    while (state.ranks.length < n) state.ranks.push(makeRank(state.ranks.length + 1));\n    state.ranks.length = n;\n    state.numRanks = n;\n    if (state.editRank > n) state.editRank = 1;\n    resetOrder();\n  }"
          s = rep(s, old, new, 'setNumRanks')

          s = rep(s,
              '  function drawRanks(c, revealed) {\n    const n = state.numRanks;',
              '  function drawRanks(c, revealed) {\n    if (state.noRankMode) return;\n    const n = state.numRanks;',
              'drawRanks')
          s = rep(s,
              '    $("inp-numranks").value = String(state.numRanks);',
              '    $("inp-numranks").value = state.noRankMode ? "0" : String(state.numRanks);',
              'sync select')
          s = rep(s,
              '      numRanks: state.numRanks, titleColor: state.titleColor, accentColor: state.accentColor,',
              '      numRanks: state.numRanks, noRankMode: !!state.noRankMode, titleColor: state.titleColor, accentColor: state.accentColor,',
              'history snapshot')
          s = rep(s,
              '    state.numRanks = s.numRanks; state.titleColor = s.titleColor; state.accentColor = s.accentColor;',
              '    state.numRanks = s.numRanks; state.noRankMode = !!s.noRankMode; state.titleColor = s.titleColor; state.accentColor = s.accentColor;',
              'history restore')
          s = rep(s,
              '          niche: state.niche, topic: state.topic, numRanks: state.numRanks,\n          titleColor:',
              '          niche: state.niche, topic: state.topic, numRanks: state.numRanks, noRankMode: !!state.noRankMode,\n          titleColor:',
              'project save')
          s = rep(s,
              '      state.numRanks = s.numRanks || (s.ranks ? s.ranks.length : 6);\n      state.titleColor =',
              '      state.numRanks = s.numRanks || (s.ranks ? s.ranks.length : 6);\n      state.noRankMode = !!s.noRankMode;\n      state.titleColor =',
              'project load')
          s = rep(s,
              '    if (b) b.textContent = "Previewing rank " + editPos();',
              '    if (b) b.textContent = state.noRankMode ? "Single video preview · no ranks" : "Previewing rank " + editPos();',
              'preview badge')
          s = rep(s,
              '      row.className = "rank-row" + (pos === editPos() ? " focused" : "");',
              '      row.className = "rank-row" + (pos === editPos() ? " focused" : "") + (state.noRankMode ? " single-video-row" : "");',
              'single row class')
          s = rep(s,
              '      num.textContent = pos + ".";',
              '      num.textContent = state.noRankMode ? "" : pos + ".";',
              'rank number')
          s = rep(s,
              '    const list = $("ranks-list");\n    list.innerHTML = "";',
              '    const list = $("ranks-list");\n    list.innerHTML = "";\n    const orderPanel = $("panel-order");\n    if (orderPanel) orderPanel.classList.toggle("hidden", !!state.noRankMode);',
              'order panel')

          if 'window.RankingAppBridge = {' not in s:
              bridge = '''\n\n  // Minimal bridge for the optional FREE local AI helper.\n  window.RankingAppBridge = {\n    async getCurrentClipFile() {\n      const pos = editPos();\n      const r = state.ranks[pos - 1];\n      if (!r || !r.clip || !r.clip.url) return null;\n      const resp = await fetch(r.clip.url);\n      if (!resp.ok) return null;\n      const blob = await resp.blob();\n      return new File([blob], r.clip.name || "clip.mp4", { type: blob.type || "video/mp4" });\n    },\n    async replaceCurrentClip(file, displayName) {\n      const pos = editPos();\n      if (!file) return false;\n      assignClip(pos, file, "user", displayName || file.name || "Local AI enhanced clip");\n      return true;\n    },\n    isNoRankMode() { return !!state.noRankMode; },\n    currentPosition() { return editPos(); },\n  };\n'''
              idx = s.rfind('\n})();')
              if idx < 0:
                  raise SystemExit('Could not find app closing IIFE')
              s = s[:idx] + bridge + s[idx:]
          Path('app.js').write_text(s, encoding='utf-8')

          css = Path('style.css').read_text(encoding='utf-8')
          if 'Single-video (Number of ranks: None)' not in css:
              css += '''\n\n/* Single-video (Number of ranks: None) */\n.single-video-row .rank-num,\n.single-video-row .label-row { display: none !important; }\n.single-video-row { grid-template-columns: 86px minmax(0,1fr); }\n#panel-local-ai .panel-badge { font-size: 14px; }\n#panel-local-ai .panel-body { overflow: visible; }\n'''
          Path('style.css').write_text(css, encoding='utf-8')

      - name: Verify
        shell: bash
        run: |
          node --check app.js
          node --check local_ai_bridge.js
          python -m py_compile local_ai_server.py
          grep -q 'None · single video' index.html
          grep -q '4320×7680' index.html
          grep -q 'width: 4320' app.js
          grep -q 'RankingAppBridge' app.js

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html style.css local_ai_bridge.js local_ai_server.py
          git rm .github/workflows/apply-local-ai-single-video.yml || true
          git rm .github/workflows/apply-local-ai-single-video-v2.yml
          git commit -m "Add free Local AI enhancer, 8K export and no-rank mode"
          git push
