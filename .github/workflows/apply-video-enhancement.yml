name: Apply video enhancement

on:
  push:
    paths:
      - '.github/workflows/apply-video-enhancement.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-enhancement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append enhancement module
        shell: bash
        run: |
          if grep -q "Ranking video enhancement module v1" config.local.js; then
            echo "Enhancement module already present"
          else
            printf '\n' >> config.local.js
            cat video_enhancement_append.js >> config.local.js
          fi
          node --check config.local.js
          node --check app.js

      - name: Commit enhancement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.local.js
          git rm video_enhancement_append.js
          git rm .github/workflows/apply-video-enhancement.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add video enhancement presets and GPU quality boost"
            git push
          fi
