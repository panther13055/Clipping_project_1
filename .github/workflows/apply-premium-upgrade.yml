name: Apply premium text and export upgrade

on:
  push:
    paths:
      - '.github/workflows/apply-premium-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply tested patch
        shell: bash
        run: |
          cat premium_upgrade.patch.part1 premium_upgrade.patch.part2 premium_upgrade.patch.part3 > /tmp/premium_upgrade.patch
          patch -p2 --forward < /tmp/premium_upgrade.patch
          node --check app.js
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text()
          js=Path('app.js').read_text()
          ids=set(re.findall(r'id="([^"]+)"',html))
          refs=set(re.findall(r'\$\("([^"]+)"\)',js))
          missing=sorted(refs-ids)
          if missing:
              raise SystemExit('Missing DOM ids: '+', '.join(missing))
          for required in ['2160','3840','1440','2560','inp-title-style','title-word-colors','social/search']:
              if required not in js and required not in html:
                  raise SystemExit('Missing expected feature: '+required)
          print('Upgrade verification passed')
          PY

      - name: Commit upgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html style.css
          git rm premium_upgrade.patch.part1 premium_upgrade.patch.part2 premium_upgrade.patch.part3
          git rm .github/workflows/apply-premium-upgrade.yml
          git commit -m "Add viral title styles, multicolor words, 2K and 4K export"
          git push
