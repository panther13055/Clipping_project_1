name: Fix repeated high-res export audio

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_repeated_highres_export.py'
      - '.github/workflows/fix-repeated-highres-export.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply robust export patch
        run: python .github/scripts/fix_repeated_highres_export.py
      - name: JavaScript syntax check
        run: node --check app.js
      - name: Verify critical fixes
        run: |
          grep -q "ROBUST_EXPORT_AUDIO_V2" app.js
          grep -q "sourceAudioTrack.clone()" app.js
          grep -q "profile.width > 1080" app.js
          grep -q "stableMaster:true" app.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Fix repeated exports and high-res audio sync" || exit 0
          git push
