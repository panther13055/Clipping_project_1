name: Fix synced high-res export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-synced-highres-export.yml'
      - '.github/scripts/fix_synced_export.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/fix_synced_export.py
      - name: Syntax check
        run: node --check app.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "Fix 2K 4K 8K export with synchronized two-pass pipeline" || exit 0
          git push
