name: Add draggable video layout

on:
  push:
    paths:
      - '.github/workflows/add-draggable-video-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch live editor
        shell: python
        run: |
          from pathlib import Path

          def req(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing block: {label}")
              return text.replace(old, new, 1)

          # ---------- index.html ----------
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '        <div id="title-colors" class="title-colors"></div>\n\n'
          card = '''        <div id="title-colors" class="title-colors"></div>\n\n        <div class="tool-card" id="video-layout-card">\n          <div class="tool-card-title">Layout &amp; video position</div>\n          <div class="row compact-row">\n            <label class="mini-field">Layout\n              <select id="inp-layout-mode">\n                <option value="classic" selected>Classic center video</option>\n                <option value="bottom">Ranks on top · video at bottom</option>\n                <option value="custom">Custom draggable video</option>\n              </select>\n            </label>\n            <button class="btn btn-primary btn-small" id="btn-video-bottom" type="button">↓ Move video to bottom</button>\n            <button class="btn btn-ghost btn-small" id="btn-video-reset" type="button">Reset video</button>\n          </div>\n          <div class="row compact-row" style="margin-top:8px">\n            <label class="mini-field">X <input type="number" id="inp-video-x" min="0" max="1080" step="1"></label>\n            <label class="mini-field">Y <input type="number" id="inp-video-y" min="0" max="1920" step="1"></label>\n            <label class="mini-field">Width <input type="number" id="inp-video-w" min="240" max="1080" step="1"></label>\n            <label class="mini-field">Height <input type="number" id="inp-video-h" min="240" max="1920" step="1"></label>\n          </div>\n          <p class="hint" style="margin:8px 0 0">Choose <b>Ranks on top · video at bottom</b>, then drag the sharp video directly on the preview. Drag the yellow bottom-right handle to resize it. The blurred copy stays behind the title/ranks.</p>\n        </div>\n\n'''
          s = req(s, marker, card, 'layout card insertion')
          p.write_text(s, encoding='utf-8')

          # ---------- app.js ----------
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')

          s = req(s,
              '    numRanks: 6,\n    noRankMode: false,\n    titleColor: "#ffffff",',
              '    numRanks: 6,\n    noRankMode: false,\n    layoutMode: "classic",\n    videoRect: { x: 0, y: 900, w: 1080, h: 900 },\n    titleColor: "#ffffff",',
              'state layout fields')

          anchor = '  const fontFor = (size, family = "system") => `900 ${size}px ${fontFamilyFor(family)}`;\n\n'
          helpers = '''  const fontFor = (size, family = "system") => `900 ${size}px ${fontFamilyFor(family)}`;\n\n  function defaultVideoRect(mode = state.layoutMode || "classic") {\n    if (mode === "bottom") return { x: 0, y: 900, w: 1080, h: 900 };\n    if (mode === "custom") return { x: 60, y: 760, w: 960, h: 960 };\n    return { x: VID.x1, y: VID.y1, w: VID.x2 - VID.x1, h: VID.y2 - VID.y1 };\n  }\n  function normalizeVideoRect(rect) {\n    const base = defaultVideoRect(state.layoutMode);\n    const r = Object.assign({}, base, rect || {});\n    r.w = clamp(Number(r.w) || base.w, 240, W);\n    r.h = clamp(Number(r.h) || base.h, 240, H);\n    r.x = clamp(Number(r.x) || 0, 0, W - r.w);\n    r.y = clamp(Number(r.y) || 0, 0, H - r.h);\n    return r;\n  }\n  function layoutMetrics() {\n    const mode = state.layoutMode || "classic";\n    if (mode === "classic") return { vid: VID, title: TITLE_BOX, list: LIST_BOX };\n    const r = normalizeVideoRect(state.videoRect);\n    state.videoRect = { ...r };\n    const vid = { x1:r.x, y1:r.y, x2:r.x+r.w, y2:r.y+r.h };\n    return {\n      vid,\n      title: { x1:60, x2:W-60, y1:80, y2:270 },\n      list: { x1:60, x2:SAFE.x2, y1:300, y2:Math.max(520, Math.min(r.y - 45, 900)) },\n    };\n  }\n\n'''
          s = req(s, anchor, helpers, 'layout helpers')

          # drawTitle uses dynamic title box
          a = s.index('  function drawTitle(c) {')
          b = s.index('  // Trim text', a)
          seg = s[a:b]
          seg = req(seg, '  function drawTitle(c) {\n    const words = titleWords();\n    const boxW = TITLE_BOX.x2 - TITLE_BOX.x1;', '  function drawTitle(c) {\n    const words = titleWords();\n    const TB = layoutMetrics().title;\n    const boxW = TB.x2 - TB.x1;', 'drawTitle start')
          seg = seg.replace('TITLE_BOX.y2 - TITLE_BOX.y1', 'TB.y2 - TB.y1')
          seg = seg.replace('TITLE_BOX.y2 - blockH', 'TB.y2 - blockH')
          seg = seg.replace('TITLE_BOX.x1 + (boxW - ln.w) / 2', 'TB.x1 + (boxW - ln.w) / 2')
          seg = seg.replace('TITLE_BOX.x1 + (boxW - maxLineW) / 2', 'TB.x1 + (boxW - maxLineW) / 2')
          s = s[:a] + seg + s[b:]

          # drawRanks uses dynamic list box
          a = s.index('  function drawRanks(c, revealed) {')
          b = s.index('  function drawFreeTexts', a)
          seg = s[a:b]
          seg = req(seg, '    const n = state.numRanks;\n    const top = LIST_BOX.y1, bottom = LIST_BOX.y2;', '    const n = state.numRanks;\n    const LB = layoutMetrics().list;\n    const top = LB.y1, bottom = LB.y2;', 'drawRanks box')
          seg = seg.replace('LIST_BOX.x1', 'LB.x1').replace('LIST_BOX.x2', 'LB.x2')
          s = s[:a] + seg + s[b:]

          # draw video into selected rectangle
          s = req(s, '  function drawVideoCover(c, video, crop) {\n    const vw = video.videoWidth, vh = video.videoHeight;\n    if (!vw || !vh) return;\n    const bw = VID.x2 - VID.x1, bh = VID.y2 - VID.y1;', '  function drawVideoCover(c, video, crop, target = VID) {\n    const vw = video.videoWidth, vh = video.videoHeight;\n    if (!vw || !vh) return;\n    const bw = target.x2 - target.x1, bh = target.y2 - target.y1;', 'drawVideoCover signature')
          s = req(s, '    c.drawImage(video, VID.x1 + ox, VID.y1 + oy, dw, dh);', '    c.drawImage(video, target.x1 + ox, target.y1 + oy, dw, dh);', 'drawVideoCover target')

          # renderFrameTo dynamic video region + draggable handle
          s = req(s, '  function renderFrameTo(c, bg, revealed, ui, pos) {\n    hitBoxes = [];\n    if (pos == null) pos = editPos();\n    let blurReady = false;', '  function renderFrameTo(c, bg, revealed, ui, pos) {\n    hitBoxes = [];\n    if (pos == null) pos = editPos();\n    const LM = layoutMetrics();\n    const V = LM.vid;\n    let blurReady = false;', 'render metrics')
          s = s.replace('c.rect(VID.x1, VID.y1, VID.x2 - VID.x1, VID.y2 - VID.y1);', 'c.rect(V.x1, V.y1, V.x2 - V.x1, V.y2 - V.y1);', 2)
          s = req(s, '      drawVideoCover(c, bg, clipCrop);', '      drawVideoCover(c, bg, clipCrop, V);', 'render video target')
          s = req(s, '    // cover boxes hide part of THIS rank\'s footage; handles show only while editing\n    drawCoverBoxes(c, blurReady, !engine.recording && !engine.running, pos);\n    drawTitle(c);', '''    // cover boxes hide part of THIS rank's footage; handles show only while editing\n    drawCoverBoxes(c, blurReady, !engine.recording && !engine.running, pos);\n    if ((state.layoutMode || "classic") !== "classic") {\n      hitBoxes.push({ id:"videoRect", x:V.x1, y:V.y1, w:V.x2-V.x1, h:V.y2-V.y1 });\n      if (!engine.recording && !engine.running) {\n        const active = ui && ((ui.dragId === "videoRect") || (ui.selectedId === "videoRect"));\n        if (active) {\n          c.save();\n          c.setLineDash([12,10]); c.lineWidth=3; c.strokeStyle="rgba(91,214,255,.96)";\n          c.strokeRect(V.x1,V.y1,V.x2-V.x1,V.y2-V.y1);\n          c.setLineDash([]); c.fillStyle="rgba(245,197,24,.98)";\n          c.fillRect(V.x2-BOX_GRIP,V.y2-BOX_GRIP,BOX_GRIP,BOX_GRIP);\n          c.restore();\n        }\n      }\n    }\n    drawTitle(c);''', 'video hitbox')
          s = req(s, '      const guide = activeId === "title" ? TITLE_BOX : (activeId && activeId.startsWith("free:") ? SAFE : LIST_BOX);', '      const guide = activeId === "title" ? LM.title : (activeId === "videoRect" ? {x1:0,y1:0,x2:W,y2:H} : (activeId && activeId.startsWith("free:") ? SAFE : LM.list));', 'active guide')
          s = req(s, '      c.moveTo(0, VID.y1); c.lineTo(W, VID.y1);\n      c.moveTo(0, VID.y2); c.lineTo(W, VID.y2);', '      c.moveTo(0, V.y1); c.lineTo(W, V.y1);\n      c.moveTo(0, V.y2); c.lineTo(W, V.y2);', 'video edge guides')

          # history/save persistence
          s = req(s, '      numRanks: state.numRanks, noRankMode: !!state.noRankMode, titleColor: state.titleColor, accentColor: state.accentColor,', '      numRanks: state.numRanks, noRankMode: !!state.noRankMode, layoutMode: state.layoutMode || "classic", videoRect: { ...(state.videoRect || defaultVideoRect()) }, titleColor: state.titleColor, accentColor: state.accentColor,', 'snapshot layout')
          s = req(s, '    state.numRanks = s.numRanks; state.noRankMode = !!s.noRankMode; state.titleColor = s.titleColor; state.accentColor = s.accentColor;', '    state.numRanks = s.numRanks; state.noRankMode = !!s.noRankMode; state.layoutMode = s.layoutMode || "classic"; state.videoRect = normalizeVideoRect(s.videoRect || defaultVideoRect(state.layoutMode)); state.titleColor = s.titleColor; state.accentColor = s.accentColor;', 'restore layout')
          s = req(s, '          niche: state.niche, topic: state.topic, numRanks: state.numRanks, noRankMode: !!state.noRankMode,', '          niche: state.niche, topic: state.topic, numRanks: state.numRanks, noRankMode: !!state.noRankMode, layoutMode: state.layoutMode || "classic", videoRect: { ...(state.videoRect || defaultVideoRect()) },', 'project save layout')
          s = req(s, '      state.numRanks = s.numRanks || (s.ranks ? s.ranks.length : 6);\n      state.noRankMode = !!s.noRankMode;', '      state.numRanks = s.numRanks || (s.ranks ? s.ranks.length : 6);\n      state.noRankMode = !!s.noRankMode;\n      state.layoutMode = s.layoutMode || "classic";\n      state.videoRect = normalizeVideoRect(s.videoRect || defaultVideoRect(state.layoutMode));', 'project load layout')

          # sync UI
          s = req(s, '    const ts = $("inp-title-style"); if (ts) ts.value = state.titleStyle || "viral";\n    rebuildTitleColors();', '''    const ts = $("inp-title-style"); if (ts) ts.value = state.titleStyle || "viral";\n    const lm = $("inp-layout-mode"); if (lm) lm.value = state.layoutMode || "classic";\n    const vr = normalizeVideoRect(state.videoRect || defaultVideoRect(state.layoutMode));\n    [["inp-video-x",vr.x],["inp-video-y",vr.y],["inp-video-w",vr.w],["inp-video-h",vr.h]].forEach(([id,v]) => { const el=$(id); if(el) el.value=Math.round(v); });\n    rebuildTitleColors();''', 'sync layout UI')

          # UI events after side size
          target = '''  $("inp-side-size").addEventListener("input", (e) => {\n    state.sideScale = e.target.value / 100;\n    $("val-side-size").textContent = e.target.value + "%";\n    scheduleCommit(); scheduleStatic();\n  });'''
          repl = target + '''\n  const layoutSel = $("inp-layout-mode");\n  if (layoutSel) layoutSel.addEventListener("change", (e) => {\n    state.layoutMode = e.target.value || "classic";\n    if (state.layoutMode !== "classic") state.videoRect = defaultVideoRect(state.layoutMode);\n    syncInputsFromState(); scheduleCommit(); scheduleStatic();\n  });\n  function syncVideoRectFromFields() {\n    const ids=["inp-video-x","inp-video-y","inp-video-w","inp-video-h"];\n    if (ids.some(id => !$(id))) return;\n    state.videoRect = normalizeVideoRect({x:Number($(ids[0]).value),y:Number($(ids[1]).value),w:Number($(ids[2]).value),h:Number($(ids[3]).value)});\n    syncInputsFromState(); scheduleCommit(); scheduleStatic();\n  }\n  ["inp-video-x","inp-video-y","inp-video-w","inp-video-h"].forEach(id => { const el=$(id); if(el) el.addEventListener("change", syncVideoRectFromFields); });\n  const vb=$("btn-video-bottom"); if(vb) vb.addEventListener("click",()=>{ state.layoutMode="bottom"; state.videoRect={x:0,y:900,w:1080,h:900}; syncInputsFromState(); commitHistory(); renderStatic(); });\n  const vrst=$("btn-video-reset"); if(vrst) vrst.addEventListener("click",()=>{ state.videoRect=defaultVideoRect(state.layoutMode); syncInputsFromState(); commitHistory(); renderStatic(); });'''
          s = req(s, target, repl, 'layout UI events')
          s = req(s, '    state.layout = { title: null, ranks: {}, ranksGroup: null };\n    scheduleCommit();', '    state.layout = { title: null, ranks: {}, ranksGroup: null };\n    state.videoRect = defaultVideoRect(state.layoutMode);\n    syncInputsFromState();\n    scheduleCommit();', 'reset layout')

          # canvas dragging
          s = req(s, '  const isTextId = (id) => id === "title" || id === "watermark" || id === "ranksGroup" || id.startsWith("rank") || id.startsWith("free:");', '  const isTextId = (id) => id === "title" || id === "watermark" || id === "ranksGroup" || id === "videoRect" || id.startsWith("rank") || id.startsWith("free:");', 'selectable video')
          s = req(s, '    const pri = (b) => (b.id.startsWith("free:") ? 0 : b.id.indexOf("rank") === 0 ? 1 : b.id === "title" ? 2 : 3);', '    const pri = (b) => (b.id.startsWith("free:") ? 0 : b.id.indexOf("rank") === 0 ? 1 : b.id === "title" ? 2 : b.id === "videoRect" ? 4 : 3);', 'hit priority')
          s = req(s, '    if (id === "watermark") {\n      state.watermark.x = clamp((state.watermark.x || (W - 180)) + dx, 0, W);\n      state.watermark.y = clamp((state.watermark.y || (H - 120)) + dy, 0, H);\n    } else if (id.startsWith("free:")) {', '    if (id === "watermark") {\n      state.watermark.x = clamp((state.watermark.x || (W - 180)) + dx, 0, W);\n      state.watermark.y = clamp((state.watermark.y || (H - 120)) + dy, 0, H);\n    } else if (id === "videoRect") {\n      const r=normalizeVideoRect(state.videoRect); r.x=clamp(r.x+dx,0,W-r.w); r.y=clamp(r.y+dy,0,H-r.h); state.videoRect=r;\n    } else if (id.startsWith("free:")) {', 'move video by fields')
          s = req(s, '    if (hb.id.indexOf("box") === 0) {\n      if (engine.running) return;\n      const bx = rankBoxes(editPos()).find((b) => b.id === hb.id); if (!bx) return;', '    if (hb.id.indexOf("box") === 0 || hb.id === "videoRect") {\n      if (engine.running) return;\n      if (hb.id === "videoRect") selectText("videoRect");\n      const bx = hb.id === "videoRect" ? (state.videoRect || (state.videoRect=defaultVideoRect(state.layoutMode))) : rankBoxes(editPos()).find((b) => b.id === hb.id); if (!bx) return;', 'pointerdown video')
          old_move = '''    if (drag && drag.box) {\n      const dx = p.x-drag.startX, dy=p.y-drag.startY;\n      if (drag.mode === "resize") { drag.box.w=Math.max(24,drag.ow+dx); drag.box.h=Math.max(24,drag.oh+dy); }\n      else { drag.box.x=drag.ox+dx; drag.box.y=drag.oy+dy; }\n      renderStatic();'''
          new_move = '''    if (drag && drag.box) {\n      const dx = p.x-drag.startX, dy=p.y-drag.startY;\n      if (drag.id === "videoRect") {\n        if (drag.mode === "resize") { drag.box.w=Math.max(240,drag.ow+dx); drag.box.h=Math.max(240,drag.oh+dy); }\n        else { drag.box.x=drag.ox+dx; drag.box.y=drag.oy+dy; }\n        state.videoRect=normalizeVideoRect(drag.box);\n      } else {\n        if (drag.mode === "resize") { drag.box.w=Math.max(24,drag.ow+dx); drag.box.h=Math.max(24,drag.oh+dy); }\n        else { drag.box.x=drag.ox+dx; drag.box.y=drag.oy+dy; }\n      }\n      renderStatic(); updateSelectionControls();'''
          s = req(s, old_move, new_move, 'pointermove video')
          s = req(s, '      canvas.style.cursor = hb ? (hb.id.indexOf("box")===0 && onBoxGrip(p,hb) ? "nwse-resize" : isLocked(hb.id) ? "not-allowed" : "grab") : "default";', '      canvas.style.cursor = hb ? (((hb.id.indexOf("box")===0 || hb.id === "videoRect") && onBoxGrip(p,hb)) ? "nwse-resize" : isLocked(hb.id) ? "not-allowed" : "grab") : "default";', 'video cursor')
          s = req(s, '    else if(id==="watermark") { state.watermark.x=W-180; state.watermark.y=H-120; }\n    else if(id.startsWith("rank"))', '    else if(id==="watermark") { state.watermark.x=W-180; state.watermark.y=H-120; }\n    else if(id==="videoRect") { state.videoRect=defaultVideoRect(state.layoutMode); }\n    else if(id.startsWith("rank"))', 'reset selected video')

          # selection controls: width/height + avoid fake lock for video
          s = req(s, '    const xInp = $("inp-pos-x"), yInp = $("inp-pos-y"), reset = $("btn-reset-selected"), selLock = $("inp-selected-lock");', '    const xInp = $("inp-pos-x"), yInp = $("inp-pos-y"), reset = $("btn-reset-selected"), selLock = $("inp-selected-lock");\n    const vx=$("inp-video-x"), vy=$("inp-video-y"), vw=$("inp-video-w"), vh=$("inp-video-h");', 'video selection fields')
          s = req(s, '    if (selLock) { selLock.disabled = !has; selLock.checked = has ? isLocked(id) : false; }', '    if (selLock) { selLock.disabled = !has || id === "videoRect"; selLock.checked = has && id !== "videoRect" ? isLocked(id) : false; }\n    if (vx&&vy&&vw&&vh) { const r=normalizeVideoRect(state.videoRect); vx.value=Math.round(r.x); vy.value=Math.round(r.y); vw.value=Math.round(r.w); vh.value=Math.round(r.h); }', 'selection field sync')

          p.write_text(s, encoding='utf-8')

      - name: Validate JavaScript
        run: node --check app.js
      - name: Commit changes and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git rm .github/workflows/add-draggable-video-layout.yml
          git commit -m "Add draggable bottom-video layout to live editor"
          git push
