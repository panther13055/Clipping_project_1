name: Add premium custom rank colors

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_premium_rank_custom_colors.py'
      - '.github/workflows/add-premium-rank-custom-colors.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply custom premium rank colors
        run: python .github/scripts/add_premium_rank_custom_colors.py
      - name: Syntax check
        run: node --check app.js
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html style.css
          git commit -m "Add custom per-rank premium colors" || exit 0
          git push
