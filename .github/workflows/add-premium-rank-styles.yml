name: Add premium rank styles

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_premium_rank_styles.py'
      - '.github/workflows/add-premium-rank-styles.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply premium rank styles
        run: python .github/scripts/add_premium_rank_styles.py
      - name: Syntax check
        run: node --check app.js
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html style.css
          git commit -m "Add premium rank number color styles" || exit 0
          git push
