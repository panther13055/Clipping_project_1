name: Fix high-res export and Local AI v3

on:
  push:
    paths:
      - '.github/workflows/fix-export-local-ai.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fixes
        run: python fix_export_local_ai.py

      - name: Verify
        run: |
          node --check app.js
          node --check local_ai_bridge.js
          python -m py_compile local_ai_server.py
          grep -q 'recorderElapsedUs' app.js
          grep -q 'Access-Control-Allow-Private-Network' local_ai_server.py
          grep -q 'model_dir = exe_dir / "models"' local_ai_server.py

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js local_ai_server.py local_ai_bridge.js
          git rm .github/workflows/fix-export-local-ai.yml fix_export_local_ai.py
          git commit -m "Fix high-resolution export sync and Local AI runtime"
          git push
