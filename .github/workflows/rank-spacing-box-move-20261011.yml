name: Add equal rank spacing and draggable rank box

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/implement-rank-spacing-box-move-20261011.py'
      - '.github/workflows/rank-spacing-box-move-20261011.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply rank layout controls
        run: python .github/scripts/implement-rank-spacing-box-move-20261011.py
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Verify feature markers
        run: |
          grep -q "RANK_SPACING_BOX_MOVE_V1" app.js
          grep -q "equalizeRankSpacing" app.js
          grep -q "inp-auto-rank-spacing" index.html
          grep -q "inp-rank-box-move" index.html
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "Add auto equal rank spacing and draggable group box" || exit 0
          git push
